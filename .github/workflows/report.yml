name: Отчёт по спецпроекту

on:
  schedule:
    - cron: '0 6 * * *'      # ежедневно в 09:00 MSK
  workflow_dispatch:          # и вручную по кнопке

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Собрать отчёт из Метрики
        env:
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
        run: |
          python3 build.py
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
